[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trinity-tts"
version = "0.1.0"
description = "A lightweight, hardware-friendly text-to-speech research toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Trinity TTS Contributors" }]
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.1"]
dev = ["pytest>=8.0"]

[project.scripts]
trinity-tts = "trinity_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
